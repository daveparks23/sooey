name: hog_sim
description: >-
  Pure Dart tick simulation for Hog Pocket. Runs on the Dart VM (tests), in
  dart2js (the Cloud Functions server), and in the Flutter web client. All three
  must produce byte-identical output, so this package must never depend on
  Flutter, Firebase, or anything platform-specific.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
